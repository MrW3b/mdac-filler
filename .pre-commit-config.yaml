# Local gate. Mirrored in CI by .github/workflows/lint.yml (super-linter).
# Install once: pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: eslint
        name: eslint (userscript)
        entry: npx eslint
        language: system
        files: ^mdac-filler\.user\.js$
